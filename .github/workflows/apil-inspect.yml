name: Inspect APIL connection paths
on:
  push:
    paths: ['.github/workflows/apil-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Print exact source ranges
        shell: bash
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('source/APIL-source.zip') as z:
              for name,lo,hi in [
                  ('src/attach.hpp',1,110),
                  ('src/profile.hpp',1,110),
                  ('src/apil_runtime.hpp',1,80),
                  ('src/telemetry.hpp',1,90),
                  ('src/external_reader.cpp',1,230),
                  ('src/controller.cpp',215,240),
                  ('src/controller.cpp',440,533),
                  ('src/controller.cpp',1100,1197),
                  ('src/controller.cpp',1380,1405),
                  ('src/controller.cpp',1455,1477),
                  ('ui/app.js',134,226)]:
                  lines=z.read(name).decode('utf-8-sig',errors='replace').splitlines()
                  print(f'===FILE {name}:{lo}-{hi}===')
                  for i in range(lo-1,min(hi,len(lines))):
                      print(f'{i+1:05}: {lines[i]}')
          PY
