name: APIL source inspection (temporary)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apil-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect packaged UI and commands
        run: |
          python3 - <<'PY'
          import zipfile,re
          with zipfile.ZipFile("source/APIL-source.zip") as z:
              for path in ("ui/route-editor.js","ui/app.js","ui/index.html","ui/map-frame.js","src/apil_release.hpp"):
                  lines=z.read(path).decode("utf-8-sig").splitlines()
                  print("\n#####",path,"lines",len(lines))
                  for i,line in enumerate(lines):
                      print(f"APILSRC {path}:{i+1}: {line}")
              for path,regex,margin in (
                ("src/controller.cpp",r"void updateWebState|void webCommand|else if\(parts\.size\(\)==11|parts\[0\]==L\"route\"|void prepareLap|void finishRecord|void selectSavedRoute|void togglePlayback|void selectNearbyStart|if\(mode==Mode::Brake\)",12),
                ("src/route_catalog.hpp",r".",0),
              ):
                  lines=z.read(path).decode("utf-8-sig").splitlines()
                  hits=[i for i,line in enumerate(lines) if re.search(regex,line)]
                  covered=set()
                  for n in hits:
                      for j in range(max(0,n-margin),min(len(lines),n+margin+1)):covered.add(j)
                  print("\n#####",path,"match",len(covered))
                  for i in sorted(covered):print(f"APILSRC {path}:{i+1}: {lines[i]}")
          PY
