name: Test APIL 0.2.10 performance changes
on:
  push:
    paths: ['.github/workflows/apil-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dry run performance migration
        run: |
          set -euo pipefail
          python3 .github/scripts/apil-performance-fix.py
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile('source/APIL-source.zip') as z:
              assert b"Sleep(8)" in z.read("src/external_reader.cpp")
              assert b"reportInterval" in z.read("src/controller.cpp")
              assert b"Squared distance" in z.read("src/overlay.hpp")
              assert b'0.2.10' in z.read('src/apil_release.hpp')
              Path('/tmp/apil-app.js').write_bytes(z.read('ui/app.js'))
          PY
          node --check /tmp/apil-app.js