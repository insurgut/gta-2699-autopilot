name: APIL source inspection (temporary)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apil-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect packaged sources
        run: |
          python3 - <<'PY'
          import zipfile,re
          with zipfile.ZipFile("source/APIL-source.zip") as z:
              names=z.namelist()
              print("SOURCE FILES:")
              for name in names:
                  if name.startswith(("src/","ui/","web/")) and (name in ("src/controller.cpp","src/apil_ui.inc","src/route.hpp","src/route_catalog.hpp","src/apil_release.hpp") or name.startswith(("ui/","web/"))):
                      print(name,z.getinfo(name).file_size)
              for path in ("src/route.hpp","src/route_catalog.hpp","src/apil_release.hpp","src/controller.cpp","src/apil_ui.inc"):
                  if path not in names: continue
                  lines=z.read(path).decode("utf-8-sig").splitlines()
                  print("\n====",path,"COUNT",len(lines),"====")
                  if path.endswith(("route.hpp","apil_release.hpp")):
                      for i,line in enumerate(lines):print(f"{i+1}: {line[:260]}")
                      continue
                  pats=("finishHold","loopRestartReady","mode==Mode::Brake","routeCatalog","apil_ui.inc","webview","WebView","routeMap","paintMap","WM_LBUTTONUP","route|","routeData","routeVisualRevision","writeSettings","routeInputs","playbackRoute","function ")
                  candidates=[i for i,s in enumerate(lines) if any(x in s for x in pats)]
                  included=set()
                  for i in candidates[:125]:
                      for j in range(max(0,i-2),min(len(lines),i+3)):included.add(j)
                  for i in sorted(included):
                      print(f"{i+1}: {lines[i][:320]}")
          PY
