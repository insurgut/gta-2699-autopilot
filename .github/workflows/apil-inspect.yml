name: Inspect APIL connection paths
on:
  push:
    paths: ['.github/workflows/apil-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dry-run APIL connection migration
        shell: bash
        run: |
          set -e
          python3 .github/scripts/apil-seamless-loop-optim.py
          python3 .github/scripts/apil-connection-fix.py
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile('source/APIL-source.zip') as z:
              Path('/tmp/apil-app.js').write_bytes(z.read('ui/app.js'))
              print('patched version:',z.read('src/apil_release.hpp').decode())
              assert b"districtGameName" in z.read('src/attach.hpp')
              assert b"Connection connected=" in z.read('src/controller.cpp')
          PY
          node --check /tmp/apil-app.js
