name: Inspect APIL seamless loop
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apil-drive-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect live playback paths in source zip
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          import re
          with ZipFile('source/APIL-source.zip') as z:
            for path in ('src/controller.cpp','src/driving.hpp','src/progress_policy.hpp','src/loop_policy.hpp','src/endpoint_settings.hpp','src/route_selection.hpp','src/stops.hpp','src/route_catalog.hpp','ui/route-editor.js','ui/css/district.css','build-mingw.sh'):
              ls=z.read(path).decode('utf-8-sig').splitlines()
              print('BEGIN',path,'total',len(ls))
              if path=='src/controller.cpp':
                for i,line in enumerate(ls):
                  if any(k in line for k in ('Mode::Drive','Mode::Armed','Mode::Brake','Mode::Hold','nextGoal(','prepareLap(','requestJoin(','loopRestartReady','activeRoute.back','activeRoute.size()-','route[segment+','endPoint','endpointRestartAt','finishHold','segment++','segment=','pendingStop','targetSpeed','target=','speedDemand')):
                    start=max(0,i-3);stop=min(len(ls),i+6)
                    print('HIT',i+1)
                    for j in range(start,stop):print('APIL:',path,j+1,ls[j][:650])
              elif path.startswith('ui/'):
                for i,line in enumerate(ls):
                  if any(k in line for k in ('endpoint-blip','endpoint-marker','endpointPopup','drawEndpoints','drawWaitMarkers','routeColor','finish-blip','function draw','function update','blip-color')):
                    print('APIL:',path,i+1,line[:1000])
              else:
                for i,line in enumerate(ls):
                  if len(ls)<125 or any(k in line for k in ('Brake','finish','loop','segment','endpoint')):
                    print('APIL:',path,i+1,line[:1000])
          PY
