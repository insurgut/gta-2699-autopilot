name: Inspect APIL section removal and braking
on:
  push:
    paths: ['.github/workflows/apil-inspect-bugs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect extracted code and highlight handlers
        run: |
          python3 - <<'PY'
          import zipfile,re
          with zipfile.ZipFile('source/APIL-source.zip') as z:
            names=[n for n in z.namelist() if n.startswith(('src/','ui/')) and n.endswith(('.cpp','.hpp','.js','.css'))]
            for name in names:
              if any(s in name for s in ('route-editor','route_catalog','route_sections','stops','controller','drive','autopilot','recorder','speed','app.js','player','route.hpp')):
                print('FILE',name,'BYTES',z.getinfo(name).file_size,flush=True)
            for name in ['ui/route-editor.js','src/route_catalog.hpp','src/route_sections.hpp','src/stops.hpp','src/route.hpp']:
              s=z.read(name).decode('utf-8-sig').splitlines()
              print('\n==================== '+name+' ('+str(len(s))+' lines) ====================')
              for i,line in enumerate(s):
                if len(s)<210 or re.search(r'delet|remove|section|brak|speed|stop|wait|limit|pace|length|erase|unlink|interval',line,re.I):
                  print(f'{i+1:04}: {line[:500]}')
            for name in ['src/controller.cpp','ui/app.js']:
              s=z.read(name).decode('utf-8-sig').splitlines()
              print('\n==================== '+name+' ('+str(len(s))+' lines) ====================')
              for i,line in enumerate(s):
                if re.search(r'(section\||section-|delete|remove|erase|noRecordedBraking|routeSpeed|nextStop|speedCap|desiredSpeed|targetSpeed|recordedSpeed|brak|slow|limit|runControl|throttle|cruise)',line,re.I):
                  for j in range(max(0,i-1),min(len(s),i+2)):
                    print(f'{j+1:04}: {s[j][:650]}')
            print('\n==================== other speed-related files ====================')
            for name in names:
              if not name.startswith('src/') or name in ['src/controller.cpp','src/route_catalog.hpp','src/route_sections.hpp','src/stops.hpp','src/route.hpp']:continue
              s=z.read(name).decode('utf-8-sig').splitlines()
              matches=[(i,line) for i,line in enumerate(s) if re.search(r'routeSpeedAt|routeSpeedAheadCap|nextStop|recordedSpeedEdge|noRecordedBraking|brake|speedLimit|waitMs',line,re.I)]
              if matches:
                print('\nFILE',name,'len',len(s),'matches',len(matches))
                for i,line in matches[:28]:print(f'{i+1:04}: {line[:400]}')
          PY

      - name: Focused exact code excerpts
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          groups={
           'src/controller.cpp':[(1283,1320),(925,945)],
           'ui/route-editor.js':[(338,371),(416,420)],
           'src/driving.hpp':[(1,65)],
           'src/route_selection.hpp':[(1,55)],
           'src/input_enter_markers.hpp':[(1,30)],
           'src/route_catalog.hpp':[(65,92)],
           'src/route_sections.hpp':[(11,51)],
          }
          with ZipFile('source/APIL-source.zip') as z:
           for name,ranges in groups.items():
            s=z.read(name).decode('utf-8-sig').splitlines()
            print('## BEGIN',name)
            for a,b in ranges:
             for i in range(a,min(b,len(s))+1):print(f'{i:04}: {s[i-1]}')
            print('## END',name)
          PY
