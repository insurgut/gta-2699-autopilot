name: Inspect APIL section UI and braking
on:
  push:
    paths:
      - .github/workflows/apil-section-inspect.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect updated application sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from zipfile import ZipFile
          with ZipFile('source/APIL-source.zip') as z:
              names=z.namelist()
              print('=== ALL SOURCE FILES ===',flush=True)
              print('\n'.join(names),flush=True)
              print('=== RELEVANT UI AND ROUTE SOURCE ===',flush=True)
              patterns = re.compile(r'brak|торм|section|segment|zone|custom|switch|popup|modal|settings',re.I)
              for name in names:
                  if not name.endswith(('.js','.css','.hpp','.cpp','.html')): continue
                  if not (name.startswith('ui/') or name in ['src/controller.cpp','src/route.hpp','src/driving.hpp','src/route_actions.hpp','src/custom_sections.hpp']): continue
                  if not (name.startswith('ui/') or 'route' in name): continue
                  try: source=z.read(name).decode('utf-8-sig').splitlines()
                  except UnicodeError: continue
                  matched=[i for i,l in enumerate(source) if patterns.search(l)]
                  if not matched: continue
                  print(f'\n### FILE {name}: {len(source)} lines, {len(matched)} matches',flush=True)
                  if name in ('ui/route-editor.js','ui/app.js','ui/index.html','ui/css/district.css'):
                      select=set()
                      for i in matched[:135]:
                          select.update(range(max(0,i-5),min(len(source),i+6)))
                      select=sorted(select)[:650]
                  else:
                      select=set()
                      for i in matched[:75]:
                          select.update(range(max(0,i-4),min(len(source),i+5)))
                      select=sorted(select)[:330]
                  last=-2
                  for i in select:
                      if i!=last+1:print('   ...')
                      print(f'{i+1:5}: {source[i][:650]}')
                      last=i
          PY

          python3 - <<'PY'
          import re
          from zipfile import ZipFile
          with ZipFile('source/APIL-source.zip') as z:
              for name in ['src/route.hpp','src/driving.hpp','src/controller.cpp','src/custom_sections.hpp','src/route_storage.hpp','ui/route-editor.js','ui/app.js','ui/components.js','ui/index.html']:
                  if name not in z.namelist():continue
                  lines=z.read(name).decode('utf-8-sig').splitlines()
                  print(f'### DETAIL {name} ({len(lines)} lines) ###',flush=True)
                  if name in ['src/route.hpp','src/driving.hpp','ui/components.js','ui/index.html']:
                      indexes=range(min(240,len(lines)))
                  elif name=='src/controller.cpp':
                      pat=re.compile(r'brak|торм|section|route\||targetSpeed|recorded|driveOutput|accel|input|speed|saveRoute|loadRoute|custom',re.I)
                      hits=[i for i,line in enumerate(lines) if pat.search(line)]
                      subset=set()
                      for i in hits[:175]:subset.update(range(max(0,i-3),min(len(lines),i+5)))
                      indexes=sorted(subset)[:850]
                  elif name=='ui/route-editor.js':
                      indexes=sorted(set(range(0,53))|set(range(373,min(len(lines),383))))
                  else:
                      indexes=range(0,min(65,len(lines)))
                  last=-2
                  for i in indexes:
                      if i!=last+1: print('   ....')
                      print(f'{i+1:4}: {lines[i][:1100]}')
                      last=i
          PY

          python3 - <<'PY'
          import re
          from zipfile import ZipFile
          with ZipFile('source/APIL-source.zip') as z:
              for name in ['src/route_sections.hpp','src/speed_profile.hpp','src/stops.hpp','src/route_catalog.hpp','src/input_pose.hpp','src/web_ui.hpp','src/controller.cpp','ui/app.js']:
                  t=z.read(name).decode('utf-8-sig').splitlines()
                  print(f'### TARGET {name} ({len(t)} lines) ###')
                  if name=='src/controller.cpp':
                      ids=list(range(1150,min(1530,len(t))))
                  elif name=='ui/app.js':
                      ids=list(range(150,min(225,len(t))))
                  elif name=='src/web_ui.hpp':
                      pat=re.compile('path|route|section|speedLimit|ignoreObstacles')
                      hits=[i for i,v in enumerate(t) if pat.search(v)]
                      sel=set()
                      for i in hits[:85]:sel.update(range(max(0,i-2),min(len(t),i+4)))
                      ids=sorted(sel)[:240]
                  else:
                      ids=list(range(min(250,len(t))))
                  last=-2
                  for i in ids:
                      if i!=last+1:print(' ....')
                      print(f'{i+1:4}: {t[i][:1200]}')
                      last=i
          PY

      - name: Test APIL 0.2.11 section no-braking migration
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apil-section-no-braking.py
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          root=Path('/tmp/apil-test')
          root.mkdir(exist_ok=True)
          with ZipFile('source/APIL-source.zip') as z:
              for name in ('src/no_recorded_braking_tests.cpp','src/route.hpp','src/route_sections.hpp','src/stops.hpp','src/input_keys.hpp','src/speed_profile.hpp'):
                  target=root/name
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(z.read(name))
              assert b'0.2.11' in z.read('src/apil_release.hpp')
          PY
          g++ -std=c++17 -O2 -Wall -Wextra -I /tmp/apil-test/src /tmp/apil-test/src/no_recorded_braking_tests.cpp -o /tmp/test-apil-braking
          /tmp/test-apil-braking
